name: Release Draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Release Cli
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "Mmx233/GoReleaseCli"
          latest: true
          fileName: "release_linux_amd64.tar.gz"
          extract: true
          out-file-path: "./build/"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Build
        env:
          NAME: action-cache-server
          PLATFORMS: >-
            darwin/amd64,darwin/arm64,
            freebsd/386,freebsd/amd64,freebsd/arm,freebsd/arm64,
            linux/386,linux/amd64,linux/arm,linux/arm64,linux/loong64,linux/ppc64le,linux/riscv64,linux/s390x,
            windows/386,windows/amd64,windows/arm64
        shell: bash
        run: |
          ./build/release ./cmd/server --output build/output \
            --name "$NAME" \
            --platforms "${PLATFORMS// /}" \
            -c tar.gz \
            -j 1

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: build/output/*.tar.gz
